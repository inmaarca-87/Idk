<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10243d">
<title>42112 — Flappy Flight</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #08182b; color: #fff;
    font-family: system-ui, Arial, sans-serif;
    touch-action: none;
  }
  body { display:flex; align-items:center; justify-content:center; }
  .game-wrap {
    position:relative; width:min(100vw, 480px); height:min(100dvh, 850px);
    overflow:hidden; background:#80d7e8;
    box-shadow:0 0 35px #0008;
  }
  canvas { display:block; width:100%; height:100%; }
  .topbar {
    position:absolute; top:12px; left:0; right:0; z-index:2;
    text-align:center; pointer-events:none; text-shadow:0 2px 5px #18334c;
  }
  .brand { font-size:11px; letter-spacing:4px; font-weight:800; }
  .score { font-size:42px; font-weight:900; line-height:1.1; }
  .overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; background:#06162966; z-index:3;
  }
  .panel {
    width:100%; max-width:330px; padding:25px 20px; text-align:center;
    border:1px solid #ffffff55; border-radius:22px;
    background:linear-gradient(160deg,#163b5bF2,#091a2df2);
    box-shadow:0 15px 45px #00101f77;
  }
  h1 { margin:0 0 8px; font-size:27px; letter-spacing:1px; }
  .sub { color:#c7d9e8; font-size:13px; line-height:1.5; margin:0 0 18px; }
  button {
    border:0; border-radius:999px; padding:13px 25px; min-width:160px;
    background:#ffd45c; color:#15263a; font-size:15px; font-weight:900;
  }
  .hint { color:#a9c1d5; font-size:11px; margin-top:14px; }
  .footer {
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    color:#12334b; font-size:10px; font-weight:800; letter-spacing:2px;
    text-shadow:0 1px 2px #fff8; pointer-events:none;
  }
</style>
</head>
<body>
<div class="game-wrap">
  <canvas id="game" aria-label="Game Flappy Flight"></canvas>
  <div class="topbar">
    <div class="brand">42112 • SIGNATURE BY A LOVE</div>
    <div class="score" id="score">0</div>
  </div>
  <div class="overlay" id="overlay">
    <div class="panel">
      <h1 id="panelTitle">FLAPPY FLIGHT</h1>
      <p class="sub" id="panelText">Terbang sejauh mungkin dan hindari pipa.<br>Ketuk layar untuk mengepak!</p>
      <button id="startBtn">MULAI MAIN</button>
      <div class="hint">Dibuat oleh 42112 — Signature by a Love</div>
    </div>
  </div>
  <div class="footer">TAP TO FLY • AVOID THE PIPES</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const panelTitle = document.getElementById('panelTitle');
  const panelText = document.getElementById('panelText');
  const startBtn = document.getElementById('startBtn');

  // Upload gambar burung ke repository dengan nama "bird.png".
  // Kalau nama/ekstensinya berbeda, ubah baris di bawah ini.
  const birdImg = new Image();
  birdImg.src = 'bird.png';
  let birdImageReady = false;
  birdImg.onload = () => { birdImageReady = true; };
  birdImg.onerror = () => { birdImageReady = false; };

  let W = 360, H = 640, dpr = 1;
  let bird, pipes, score, frame, state = 'ready';
  const gravity = 0.38;
  const flapPower = -6.8;
  const pipeWidth = 62;
  const pipeGap = 172;
  const groundH = 72;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function reset() {
    bird = { x: W * 0.29, y: H * 0.43, vy: 0, r: 17, rot: 0 };
    pipes = [];
    score = 0;
    frame = 0;
    scoreEl.textContent = '0';
    addPipe(W + 40);
  }
  function addPipe(x) {
    const margin = 95;
    const gapY = margin + Math.random() * Math.max(40, H - groundH - margin * 2);
    pipes.push({ x, gapY, passed:false });
  }
  function start() {
    reset();
    state = 'playing';
    overlay.style.display = 'none';
    flap();
  }
  function flap() {
    if (state === 'ready' || state === 'over') { start(); return; }
    if (state === 'playing') bird.vy = flapPower;
  }
  function endGame() {
    if (state !== 'playing') return;
    state = 'over';
    panelTitle.textContent = 'GAME OVER';
    panelText.innerHTML = `Skor kamu: <b>${score}</b><br>Coba lagi dan pecahkan rekor!`;
    startBtn.textContent = 'MAIN LAGI';
    overlay.style.display = 'flex';
  }
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); start(); });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
  overlay.addEventListener('pointerdown', (e) => {
    if (e.target === overlay) { if (state === 'ready' || state === 'over') start(); }
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });

  function drawBackground() {
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#65c9e6'); sky.addColorStop(1,'#d1f2df');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

    // awan
    ctx.fillStyle = '#ffffff99';
    for (let i=0;i<4;i++) {
      const x = ((i*125 - frame*0.35) % (W+150) + W+150) % (W+150) - 70;
      const y = 105 + (i%3)*72;
      ctx.beginPath(); ctx.arc(x,y,19,0,Math.PI*2);
      ctx.arc(x+22,y-9,24,0,Math.PI*2);
      ctx.arc(x+48,y,18,0,Math.PI*2); ctx.fill();
    }
    // bukit
    ctx.fillStyle = '#79c99b';
    ctx.beginPath(); ctx.moveTo(0,H-groundH-40);
    for(let x=0;x<=W+20;x+=20) ctx.lineTo(x,H-groundH-35-Math.sin((x+frame*.6)/55)*17);
    ctx.lineTo(W,H-groundH); ctx.lineTo(0,H-groundH); ctx.fill();
  }
  function drawPipe(p) {
    const topH = p.gapY - pipeGap/2;
    const bottomY = p.gapY + pipeGap/2;
    const grad = ctx.createLinearGradient(p.x,0,p.x+pipeWidth,0);
    grad.addColorStop(0,'#167d50'); grad.addColorStop(.45,'#39bd70'); grad.addColorStop(1,'#126541');
    ctx.fillStyle = grad;
    ctx.fillRect(p.x,0,pipeWidth,topH);
    ctx.fillRect(p.x,bottomY,pipeWidth,H-groundH-bottomY);
    ctx.fillStyle = '#0d633f';
    ctx.fillRect(p.x-5,topH-17,pipeWidth+10,17);
    ctx.fillRect(p.x-5,bottomY,pipeWidth+10,17);
    ctx.fillStyle = '#ffffff35';
    ctx.fillRect(p.x+9,0,6,Math.max(0,topH-18));
    ctx.fillRect(p.x+9,bottomY+18,6,Math.max(0,H-groundH-bottomY-18));
  }
  function drawBird() {
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(Math.max(-.35,Math.min(.75,bird.vy*.055)));
    if (birdImageReady) {
      // Gambar otomatis dipotong ke kotak; PNG transparan paling bagus.
      ctx.drawImage(birdImg,-23,-23,46,46);
    } else {
      ctx.fillStyle = '#ffd34e';
      ctx.beginPath(); ctx.ellipse(0,0,19,15,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f39a36';
      ctx.beginPath(); ctx.moveTo(13,-2); ctx.lineTo(28,3); ctx.lineTo(13,7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(8,-7,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#172b3d';
      ctx.beginPath(); ctx.arc(10,-7,2.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e99b2f';
      ctx.beginPath(); ctx.ellipse(-7,6,9,5,-.3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function drawGround() {
    ctx.fillStyle = '#d6b66a'; ctx.fillRect(0,H-groundH,W,groundH);
    ctx.fillStyle = '#58b66c'; ctx.fillRect(0,H-groundH,W,13);
    ctx.fillStyle = '#b28b49';
    const offset = (frame*2)%28;
    for(let x=-28;x<W+28;x+=28) {
      ctx.beginPath(); ctx.moveTo(x-offset,H-groundH+25);
      ctx.lineTo(x+12-offset,H-groundH+25);
      ctx.lineTo(x+25-offset,H); ctx.lineTo(x+13-offset,H); ctx.fill();
    }
  }
  function update() {
    if (state === 'playing') {
      frame++;
      bird.vy += gravity;
      bird.y += bird.vy;
      bird.rot = bird.vy;
      if (frame % 105 === 0) addPipe(W+20);
      pipes.forEach(p => {
        p.x -= 2.45;
        if (!p.passed && p.x+pipeWidth < bird.x) {
          p.passed = true; score++; scoreEl.textContent = score;
        }
        const bx = bird.x, by = bird.y, r = 13;
        const inX = bx+r > p.x && bx-r < p.x+pipeWidth;
        if (inX && (by-r < p.gapY-pipeGap/2 || by+r > p.gapY+pipeGap/2)) endGame();
      });
      pipes = pipes.filter(p => p.x > -pipeWidth-20);
      if (bird.y < 0 || bird.y+bird.r > H-groundH) endGame();
    } else if (state === 'ready') {
      frame++;
      bird.y = H*.43 + Math.sin(frame*.08)*7;
    }
  }
  function draw() {
    drawBackground();
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();
  }
  function loop() {
    update(); draw();
    requestAnimationFrame(loop);
  }
  reset();
  loop();
})();
</script>
</div>
</body>
</html>
